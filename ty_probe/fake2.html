<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>fake canvas v2</title>
<style>
  body{margin:0;background:#0d0e11;color:#7b8291;font:14px system-ui}
  nav{margin:12px 36px}
  nav button{margin-right:8px}
  wujie-app{display:block;height:calc(100vh - 50px)}
  #blank{position:fixed;left:0;bottom:0;width:300px;height:160px;background:#14151a}
</style>
</head>
<body>
<nav aria-label="模拟节点切换"><button id="fake-node-A">节点 A</button><button id="fake-node-B">节点 B</button></nav>
<wujie-app id="wj"></wujie-app>
<div id="blank"></div>
<script>
  const host = document.getElementById('wj');
  const sr = host.attachShadow({ mode: 'open' });
  const referenceItems = [
    { id: 'a1', type: 'image', assetName: '艾洛文-高级职场套装.png', coverUrl: '' },
    { id: 'a2', type: 'image', assetName: '巴迪-狗形态.png', coverUrl: '' },
    { id: 'a3', type: 'image', assetName: '玛拉-便装.png', coverUrl: '' },
    { id: 'a4', type: 'image', assetName: '艾洛文-高级职场套装.png', coverUrl: '' },
  ];
  const base = '前缀 艾洛文-高级职场套装 中间 巴迪-狗形态 结尾 @图片3 已有引用';

  function createNode(id, refs, initial) {
    const ed = document.createElement('div');
    ed.className = '_promptEditor_fake';
    ed.contentEditable = 'true';
    ed.dataset.nodeId = id;
    ed.setAttribute('aria-label', '节点 ' + id + ' 提示词');
    ed.style.cssText = 'margin:20px 36px;padding:12px;width:620px;min-height:120px;border:1px solid #333;' +
      'background:#1b1b1f;color:#e5e7eb;white-space:pre-wrap';
    sr.appendChild(ed);
    const props = { nodeId: 'fake-' + id, value: '', maxLength: 5000, referenceItems: refs, onChange: render };

    function render(text) {
      const frag = document.createDocumentFragment();
      const re = /@(图片|视频|音频)(\d+)/g;
      let last = 0, m;
      while ((m = re.exec(text)) !== null) {
        if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        const span = document.createElement('span');
        span.className = 'canvas-mention';
        span.setAttribute('data-mention-token', m[1] + m[2]);
        span.setAttribute('contenteditable', 'false');
        span.textContent = '@' + m[1] + m[2];
        frag.appendChild(span);
        last = m.index + m[0].length;
      }
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      ed.replaceChildren(frag);
      props.value = text;
    }

    function selectText(start, end = start) {
      ed.focus();
      const locate = (off) => {
        const walker = document.createTreeWalker(ed, NodeFilter.SHOW_TEXT);
        let acc = 0, node;
        while ((node = walker.nextNode())) {
          if (acc + node.length >= off) return [node, off - acc];
          acc += node.length;
        }
        return [ed, ed.childNodes.length];
      };
      const r = document.createRange();
      r.setStart(...locate(start));
      r.setEnd(...locate(end));
      const s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
      return s.toString();
    }

    // 独立 React props；原生输入只同步模型，不经插件写回/历史。
    ed['__reactFiber$fake'] = { memoizedProps: props, return: null };
    ed.addEventListener('input', () => { props.value = ed.innerText; });
    render(initial);
    return { ed, props, render, referenceItems: refs, base: initial, selectText };
  }

  const nodes = {
    A: createNode('A', referenceItems, base),
    B: createNode('B', [
      { id: 'b1', type: 'image', assetName: '巴迪-狗形态.png', coverUrl: '' },
      { id: 'b2', type: 'image', assetName: 'B独有-场景.png', coverUrl: '' },
    ], 'B前缀 巴迪-狗形态 中间 B独有-场景 结尾 @图片1'),
  };

  function switchNode(id) {
    for (const [key, node] of Object.entries(nodes)) {
      node.ed.style.display = key === id ? 'block' : 'none';
      document.getElementById('fake-node-' + key).setAttribute('aria-pressed', String(key === id));
    }
    window.getSelection().removeAllRanges();
    nodes[id].ed.focus();
  }
  for (const id of Object.keys(nodes)) {
    document.getElementById('fake-node-' + id).addEventListener('click', () => switchNode(id));
  }
  switchNode('A');

  window.__fake = {
    ...nodes.A, nodes, switchNode,
    reset() { nodes.A.render(base); window.getSelection().removeAllRanges(); },
    setCaret(off) {
      nodes.A.selectText(off);
      return { off, text: nodes.A.ed.textContent.slice(0, 40) };
    },
    citedBadges() { return [...document.querySelectorAll('.tyq-cite-badge')].map(e => e.textContent); },
    citedChips() { return [...document.querySelectorAll('.tyq-citem')].map(e => e.textContent); },
    rows() { return [...document.querySelectorAll('.tyq-item')].map(e => e.innerText.replace(/\s+/g, ' ')); },
  };
</script>
</body>
</html>
